<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#240b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pili Pili – Compagnon de table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#240b1f;--panel:#45163b;--panel2:#56204a;--ink:#fff4e3;--mute:#dcbcd2;
  --pink:#ff2e88;--orange:#ff8a00;--yellow:#ffd23f;--teal:#14c8b4;--purple:#8e44ff;
  --green:#7bd83a;--red:#e8243c;--blue:#2f9bff;--line:#12040e;
  --title:'Luckiest Guy','Arial Black',Impact,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;height:100%}
/* Rien ne défile : l'appli occupe exactement l'écran */
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
.fit{overflow:hidden;min-height:0}
.fitin{transform-origin:0 0}
button{font:inherit;color:inherit;touch-action:manipulation}
img{user-select:none;-webkit-user-drag:none}
.muted{color:var(--mute)} .small{font-size:13px}
b,strong{font-weight:900}

/* ---------- Décor ---------- */
#bg{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(circle at 15% 5%,#64194f 0,transparent 42%),
  radial-gradient(circle at 90% 85%,#5a1230 0,transparent 48%),
  radial-gradient(circle at 70% 30%,#2b1046 0,transparent 40%),var(--bg)}
#bg::after{content:"";position:absolute;inset:0;opacity:.06;
  background-image:radial-gradient(circle,var(--yellow) 0 3px,transparent 4px),
  conic-gradient(from 45deg,var(--teal) 0 25%,transparent 0 50%,var(--pink) 0 75%,transparent 0);
  background-size:64px 64px,32px 32px}
.petal{position:fixed;top:-30px;z-index:-1;width:14px;height:14px;border-radius:60% 0 60% 0;
  background:radial-gradient(circle at 30% 30%,#ffc04d,var(--orange));opacity:.55;
  animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}

.papel{position:relative;height:var(--papel,46px);overflow:hidden;pointer-events:none;flex:none}
.papel::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:#f3dfb8;opacity:.6}
.flag{position:absolute;top:7px;width:var(--flag,40px);transform-origin:50% 0;animation:sway 3.4s ease-in-out infinite alternate;filter:drop-shadow(0 3px 0 #0006)}
.flag svg{display:block;width:100%}
@keyframes sway{from{transform:rotate(-6deg) skewX(3deg)}to{transform:rotate(6deg) skewX(-3deg)}}

/* ---------- En-tête ---------- */
#top{position:relative;flex:none;z-index:30;display:flex;align-items:center;gap:10px;padding:6px 14px;
  background:linear-gradient(#240b1ff2,#240b1fd9);backdrop-filter:blur(8px);border-bottom:3px solid var(--line)}
.brand{font-family:var(--title);font-size:24px;line-height:.9;color:var(--yellow);cursor:pointer;white-space:nowrap;
  text-shadow:2px 2px 0 var(--red),4px 4px 0 var(--line);padding-top:4px;background:none;border:0}
.brand small{display:block;font-size:12px;color:var(--orange);text-shadow:1px 1px 0 var(--line);letter-spacing:1px}
.tabs{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.tab{font-family:var(--title);font-size:16px;padding:9px 13px 6px;border-radius:12px;border:3px solid var(--line);
  background:var(--panel2);box-shadow:0 3px 0 var(--line);cursor:pointer;color:var(--ink)}
.tab.on{background:var(--yellow);color:var(--line);transform:translateY(-2px) rotate(-1.5deg)}
.iconbtn{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--panel2);font-size:21px;
  cursor:pointer;box-shadow:0 3px 0 var(--line);display:grid;place-items:center;flex:none}
.iconbtn.on{background:var(--teal)}
.mini{display:flex;align-items:center;gap:4px;background:var(--line);border:3px solid var(--line);border-radius:999px;padding:3px 4px 3px 4px;flex:none;box-shadow:0 3px 0 #000}
.mini button{width:36px;height:36px;border-radius:50%;border:0;background:var(--panel2);font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink)}
.mini button.pp{width:40px;height:40px;background:var(--pink);font-size:17px}
.mini .now{display:flex;flex-direction:column;min-width:0;width:150px;padding:0 6px;cursor:pointer;line-height:1.1}
.mini .now b{font-family:var(--title);font-weight:400;font-size:15px;color:var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .now small{font-size:11px;color:var(--mute);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .eq{display:flex;align-items:flex-end;gap:2px;height:16px;width:14px;flex:none}
.mini .eq i{flex:1;background:var(--teal);height:30%;border-radius:1px}
.mini.on .eq i{animation:eq .5s ease-in-out infinite alternate}
.mini.on .eq i:nth-child(2){animation-delay:-.2s;animation-duration:.4s}
.mini.on .eq i:nth-child(3){animation-delay:-.35s;animation-duration:.6s}
@keyframes eq{from{height:20%}to{height:100%}}
@media (max-width:1000px){.mini .now{width:96px}.mini .now small{display:none}.tab{font-size:14px;padding:8px 9px 5px}}
#top{flex-wrap:wrap}
.iconbtn.on.music{animation:wiggle 1s ease-in-out infinite}
@keyframes wiggle{50%{transform:rotate(-12deg) scale(1.08)}}

main{flex:1;min-height:0;width:100%;max-width:1440px;margin:0 auto;padding:10px 14px 12px;overflow:hidden}
#app>*{height:100%}
@media (max-height:700px){:root{--papel:30px;--flag:28px}}

/* ---------- Boutons ---------- */
.btn{font-family:var(--title);letter-spacing:.5px;font-size:20px;color:var(--line);background:var(--yellow);
  border:3px solid var(--line);border-radius:14px;padding:12px 20px 8px;box-shadow:0 5px 0 var(--line);cursor:pointer;
  transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.pink{background:var(--pink);color:#fff;text-shadow:1px 1px 0 var(--line)}
.btn.teal{background:var(--teal)}
.btn.orange{background:var(--orange)}
.btn.ghost{background:#ffffff10;color:var(--ink);border-color:#ffffff40;box-shadow:none}
.btn.big{font-size:26px;padding:15px 28px 11px}
.btn.sm{font-size:15px;padding:8px 12px 5px;border-radius:10px;box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.pulse{animation:pulseBtn 1s ease-in-out infinite alternate}
@keyframes pulseBtn{to{transform:scale(1.05);box-shadow:0 5px 0 var(--line),0 0 26px var(--yellow)}}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-top:18px}

.panel{background:var(--panel);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:18px;position:relative}
.panel.anim{animation:slideIn .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px) rotate(1deg)}}
.panel h2,.h2{font-family:var(--title);font-weight:400;margin:0 0 10px;font-size:28px;line-height:1.05;color:var(--yellow);text-shadow:2px 2px 0 var(--line)}
.panel h3{font-family:var(--title);font-weight:400;font-size:19px;margin:18px 0 8px;color:var(--orange);text-shadow:1px 1px 0 var(--line)}
.lbl{font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}

/* ---------- Accueil ---------- */
.home{text-align:center;padding-top:8px}
.hero{font-family:var(--title);font-weight:400;font-size:clamp(64px,13vw,140px);line-height:.85;margin:6px 0 10px;color:#fff;
  text-shadow:0 0 0 var(--line),4px 4px 0 var(--red),8px 8px 0 var(--line);animation:heroIn .8s cubic-bezier(.2,1.5,.4,1)}
.hero span{display:inline-block;animation:chili 1.4s ease-in-out infinite alternate}
@keyframes heroIn{from{transform:scale(.3) rotate(-10deg);opacity:0}}
@keyframes chili{to{transform:rotate(18deg) scale(1.15)}}
.lead{font-size:19px;max-width:640px;margin:0 auto 26px}
.gamepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;max-width:860px;margin:0 auto}
.gp{position:relative;background:var(--panel);border:3px solid var(--line);border-radius:24px;box-shadow:0 7px 0 var(--line);
  padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .2s;animation:pop .5s backwards}
.gp:nth-child(2){animation-delay:.12s}
.gp:hover{transform:translateY(-6px) rotate(-1deg)}
.gp:active{transform:translateY(2px)}
.gp img{width:100%;max-height:260px;object-fit:contain;border-radius:14px}
.gpn{font-family:var(--title);font-size:28px;color:var(--yellow);text-shadow:2px 2px 0 var(--line)}
.gps{color:var(--mute);font-weight:700}
.gpc{position:absolute;top:-12px;right:-10px;background:var(--pink);color:#fff;font-weight:900;border:3px solid var(--line);
  border-radius:999px;padding:4px 12px;transform:rotate(6deg);font-size:13px}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.9)}}

/* ---------- Mise en page partie ---------- */
.game-layout{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,1.1fr);gap:16px}
@media (orientation:portrait),(max-width:899px){.game-layout{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,46%) minmax(0,1fr);gap:10px}}
.left-col{height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;container-type:size}
.game-layout>.panel{height:100%;min-height:0;padding:14px 16px}

/* ---------- Table ronde (taille calculée sur la place disponible) ---------- */
.table{--tw:min(100cqw,calc(100cqh - 40px));position:relative;width:var(--tw);aspect-ratio:1;margin:0 auto;isolation:isolate;flex:none}
.felt{position:absolute;inset:19%;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#2f9174,#114a3c 72%);border:5px solid var(--line);
  box-shadow:0 0 0 9px #8a4b1f,0 0 0 12px var(--line),inset 0 0 40px #0009;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;padding:8%}
.felt::before{content:"";position:absolute;inset:-30px;border-radius:50%;z-index:-1;
  background:repeating-conic-gradient(var(--pink) 0 7.5deg,var(--orange) 7.5deg 15deg,var(--yellow) 15deg 22.5deg,var(--teal) 22.5deg 30deg,var(--purple) 30deg 37.5deg);
  animation:spin 90s linear infinite;box-shadow:0 0 0 3px var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}
.fc-round{font-family:var(--title);font-size:clamp(13px,calc(var(--tw)*.05),26px);color:var(--yellow);text-shadow:2px 2px 0 var(--line)}
.fc-sub{font-weight:900;font-size:clamp(10px,calc(var(--tw)*.026),15px);text-shadow:1px 1px 0 var(--line)}
.fc-mission{background:none;border:0;padding:0;cursor:pointer;width:34%;max-width:96px}
.fc-mission .cface{box-shadow:0 4px 0 var(--line);animation:floaty 3s ease-in-out infinite alternate}
@keyframes floaty{to{transform:translateY(-4px) rotate(2deg)}}
.seat{position:absolute;transform:translate(-50%,-50%);width:calc(var(--tw)*var(--sf,.2));display:flex;flex-direction:column;align-items:center;gap:1px;
  background:none;border:0;padding:0;cursor:pointer;z-index:2}
.seat .mask{width:58%;filter:drop-shadow(0 3px 0 var(--line));transition:transform .2s}
.seat .nm{font-weight:900;font-size:clamp(10px,calc(var(--tw)*.028),15px);background:var(--line);padding:1px 8px;border-radius:999px;max-width:125%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .pl{font-family:var(--title);font-size:clamp(11px,calc(var(--tw)*.03),17px);color:var(--yellow);text-shadow:1px 1px 0 var(--line);line-height:1}
.seat .pl small{font-size:11px;color:var(--mute)}
.pbar{width:70%;height:6px;background:#0007;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--red));transition:width .6s}
.seat.danger .pl{color:var(--red);animation:blink 1s infinite alternate}
@keyframes blink{to{opacity:.55}}
.seat.active .mask{animation:bob .6s ease-in-out infinite alternate}
.seat.active::after{content:"";position:absolute;top:-4%;width:66%;aspect-ratio:1;border-radius:50%;z-index:-1;
  box-shadow:0 0 0 4px var(--yellow),0 0 28px 6px var(--yellow);animation:blink .8s infinite alternate}
@keyframes bob{to{transform:translateY(-6px) rotate(-5deg)}}
.seat.sel .mask{transform:scale(1.15) rotate(8deg)}
.seat.sel::after{content:"";position:absolute;top:-4%;width:66%;aspect-ratio:1;border-radius:50%;z-index:-1;box-shadow:0 0 0 4px var(--pink),0 0 22px var(--pink)}
.seat.hit .mask{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-10deg)}40%{transform:translateX(8px) rotate(8deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.bub{position:absolute;top:-6px;right:-2px;min-width:clamp(24px,calc(var(--tw)*.062),36px);height:clamp(24px,calc(var(--tw)*.062),36px);border-radius:18px;background:#fff;color:var(--line);
  font-family:var(--title);font-size:clamp(12px,calc(var(--tw)*.032),19px);display:grid;place-items:center;border:3px solid var(--line);padding:3px 6px 0;line-height:1}
.bub.ok{background:var(--green)} .bub.over{background:var(--orange)} .bub.q{background:#ffffffaa}
.dchip{position:absolute;top:-8px;left:-2px;background:var(--teal);color:var(--line);font-weight:900;font-size:11px;
  border:2px solid var(--line);border-radius:8px;padding:2px 6px;transform:rotate(-10deg)}
.rchip{font-size:10px;font-weight:900;text-transform:uppercase;background:var(--purple);color:#fff;border:2px solid var(--line);border-radius:8px;padding:1px 6px}
.rchip.sab{background:var(--red)} .rchip.gar{background:var(--blue)} .rchip.pm{background:var(--orange);color:var(--line)} .rchip.hid{background:#333}

.phases{display:flex;justify-content:center;gap:4px;margin-top:6px;flex-wrap:wrap}
.phases button{border:2px solid var(--line);border-radius:999px;background:#0003;color:var(--mute);font-weight:900;font-size:13px;padding:5px 11px;cursor:pointer}
.phases button.on{background:var(--yellow);color:var(--line)}
.phases button.done{color:var(--ink);background:#ffffff1a}
.phases button:disabled{cursor:default;opacity:.5}

/* ---------- Faces de cartes ---------- */
.cface{aspect-ratio:5/7;border-radius:14px;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);overflow:hidden;
  display:grid;place-items:center;background:#fffaf0;position:relative}
.cface img{width:100%;height:100%;object-fit:contain;display:block}
.cface.icon{background:#fffaf0}
.cface.icon img{padding:13% 9%}
.cface.icon.expert{box-shadow:0 6px 0 var(--line),inset 0 0 0 5px var(--red)}
.cface.icon.expert::after{content:"EXPERT";position:absolute;bottom:5px;right:7px;font-family:var(--title);font-size:11px;color:var(--red)}
.mthumb .cface.icon.expert::after,.banner .cface::after,.log .cface::after,.fc-mission .cface::after{font-size:7px;bottom:2px;right:3px}
.cface.plain{background:#f6efe4}
.cface.plain img{padding:6%}
.cface.photo{background:#2a0a20}
.cface.photo img{padding:4%;border-radius:10px}

/* ---------- Onglet cartes ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.fchip{border:3px solid var(--line);border-radius:999px;background:var(--panel2);font-weight:900;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.fchip.on{background:var(--pink);color:#fff}
.csec{margin-bottom:34px}
.csec .h2 small{font-family:Nunito;font-size:15px;color:var(--mute);text-shadow:none;font-weight:700;margin-left:8px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:26px 18px}
@media (max-width:520px){.cgrid{grid-template-columns:repeat(2,1fr)}}
.ctile{background:none;border:0;padding:0;cursor:pointer;text-align:center;animation:pop .45s backwards}
.ctile .cface{transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
.ctile:active .cface{box-shadow:0 0 0 4px var(--yellow),0 6px 0 var(--line),0 0 22px var(--yellow)}
.ctile .ct{font-family:var(--title);font-size:18px;margin-top:11px;line-height:1.05;text-shadow:1px 1px 0 var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--line);
  border-radius:999px;padding:3px 9px;margin-top:6px;border:2px solid var(--line);background:var(--c,var(--teal))}

/* ---------- Modale ---------- */
.modal{position:fixed;inset:0;z-index:50;background:#12040ed9;backdrop-filter:blur(5px);display:grid;place-items:center;padding:14px;animation:fade .2s}
.modal.hidden{display:none}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--panel);border:3px solid var(--line);border-radius:24px;box-shadow:0 8px 0 var(--line);max-width:880px;width:100%;
  max-height:94vh;overflow:hidden;padding:20px;position:relative;animation:rise .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(50px) scale(.92);opacity:0}}
.xbtn{position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--yellow);
  color:var(--line);font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--line);z-index:3}
.card-sheet{display:grid;grid-template-columns:minmax(220px,40%) 1fr;gap:26px;align-items:start}
@media (max-width:660px){.card-sheet{grid-template-columns:1fr}.card-sheet .cface{max-width:250px;margin:0 auto}}
.card-sheet .cface{animation:flipIn .7s cubic-bezier(.2,1.25,.4,1)}
@keyframes flipIn{from{transform:perspective(1000px) rotateY(-150deg) scale(.5);opacity:0}}
.card-sheet h2{font-family:var(--title);font-weight:400;font-size:34px;margin:6px 50px 4px 0;color:var(--yellow);text-shadow:2px 2px 0 var(--line);line-height:1}
.count{color:var(--mute);font-weight:700;margin:2px 0 10px}
.rule{font-size:21px;line-height:1.45}
.rule b{color:var(--yellow)}
.rule p{margin:0 0 10px}
.appnote{margin-top:16px;background:#0003;border-left:5px solid var(--teal);padding:10px 14px;border-radius:10px;font-size:15px}
.note2{margin-top:12px;background:#ff2e8822;border-left:5px solid var(--pink);padding:10px 14px;border-radius:10px;font-size:15px}

/* ---------- Mise en place ---------- */
.addrow{display:flex;gap:10px;margin:10px 0}
.addrow input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:700;padding:10px 14px;border-radius:12px;border:3px solid var(--line);background:#fff;color:var(--line)}
.namechips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.nchip{display:inline-flex;align-items:center;gap:4px;border:3px solid var(--line);border-radius:999px;background:var(--panel2);
  font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--line);padding:0;overflow:hidden}
.nchip>button,.nchip>span{background:none;border:0;padding:8px 6px 8px 14px;cursor:pointer;font-weight:900}
.nchip .x{padding:8px 12px 8px 6px;color:var(--mute);font-size:18px}
button.nchip{padding:8px 14px}
.nchip.on{background:var(--c,var(--teal));color:var(--line)}
.namechips.avail{min-height:52px;border:2px dashed #ffffff30;border-radius:16px;padding:6px}
.namechips.avail.dropover{border-color:var(--yellow);background:#ffd23f1a}
[data-drag]{touch-action:none;user-select:none;-webkit-user-select:none}
.nchip[data-drag]{cursor:grab}
.dragging{opacity:.3}
.dropover>.mask,.nchip.dropover{outline:4px dashed var(--yellow);outline-offset:4px;border-radius:50%}
.nchip.dropover{border-radius:999px}
.ghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;transform:translate(-50%,-50%) scale(1.15) rotate(-4deg);filter:drop-shadow(0 10px 10px #0008);opacity:.95}
.seg{display:flex;border:3px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 3px 0 var(--line)}
.seg button{flex:1;border:0;background:var(--panel2);padding:11px 8px;font-weight:900;cursor:pointer}
.seg button+button{border-left:3px solid var(--line)}
.seg button.on{background:var(--yellow);color:var(--line)}

/* ---------- Phases ---------- */
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.mgroup{margin:12px 0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px;margin-top:6px}
.mthumb{background:none;border:0;padding:0;cursor:pointer;transition:transform .15s}
.mthumb .cface{border-width:2px;border-radius:9px;box-shadow:0 3px 0 var(--line)}
.mthumb{position:relative}
.mthumb.on .cface{box-shadow:0 0 0 4px var(--pink),0 0 18px 4px var(--pink)}
.mthumb.on::after{content:'✔';position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;border:2px solid var(--line)}
.mbox.fit{height:clamp(150px,30vh,250px);display:block;padding:10px}
.mbox .fitin>.mgrid2{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:start}
.mbox.empty{display:grid;place-items:center;color:var(--mute);font-weight:700}
.mbox{display:grid;grid-template-columns:110px 1fr;gap:16px;background:#0003;border-radius:16px;padding:14px;margin:12px 0;align-items:start;border:2px solid #ffffff22}
.mbox .cface{cursor:pointer}
.mbox h4{margin:0 0 4px;font-family:var(--title);font-weight:400;font-size:22px;color:var(--yellow)}
.mbox .rule{font-size:17px}
.mbox.flash{animation:flash .6s}
@keyframes flash{from{background:#ffd23f55}}
.banner{display:flex;gap:12px;align-items:center;background:#0003;border-radius:14px;padding:8px 12px;margin:10px 0;cursor:pointer;border:2px solid #ffffff22;text-align:left;width:100%}
.banner .cface{width:52px;flex:none;border-width:2px;border-radius:7px;box-shadow:none}
.banner b{display:block;color:var(--yellow);font-family:var(--title);font-weight:400;font-size:18px}
.banner span{font-size:14px;line-height:1.3;display:block}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:38px;height:38px;border-radius:10px;border:3px solid var(--line);background:var(--yellow);color:var(--line);font-weight:900;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 0 var(--line);padding:0}
.step b{min-width:32px;text-align:center;font-family:var(--title);font-size:24px;font-weight:400}
.brow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:16px;margin-bottom:7px;background:#0002;border:3px solid transparent;transition:background .2s}
.brow.cur{border-color:var(--yellow);background:#ffd23f1f}
.brow .who{display:flex;align-items:center;gap:7px;width:132px;flex:none;font-weight:900;font-size:17px;overflow:hidden}
.brow .who svg{width:36px;flex:none}
.brow .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.brow{flex-direction:column;align-items:flex-start}.brow .who{width:auto}}
.chips{display:flex;flex-wrap:wrap;gap:7px;flex:1}
.chip{min-width:48px;height:48px;border-radius:13px;border:3px solid var(--line);background:#fff;color:var(--line);font-family:var(--title);font-size:24px;
  box-shadow:0 3px 0 var(--line);cursor:pointer;padding:4px 0 0;transition:transform .1s}
.chip.on{background:var(--pink);color:#fff;transform:scale(1.1) rotate(-4deg);text-shadow:1px 1px 0 var(--line)}
.chip.no{background:#6b4a62;color:#0007;box-shadow:none;cursor:not-allowed;position:relative}
.chip.no::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:3px;background:var(--red);transform:rotate(-35deg)}
.sumline{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#0003;border-radius:14px;padding:10px 14px;font-weight:900;margin-top:10px}
.sumline .big{font-family:var(--title);font-size:28px;font-weight:400;color:var(--yellow)}
.warn{background:#e8243c33;border-left:5px solid var(--red);padding:9px 13px;border-radius:10px;margin:10px 0;font-size:15px}
.ok{background:#7bd83a26;border-left:5px solid var(--green);padding:9px 13px;border-radius:10px;margin:10px 0;font-size:15px}
.mods{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.mod{border:3px solid var(--line);border-radius:14px;background:var(--panel2);font-weight:900;padding:9px 13px;cursor:pointer;box-shadow:0 3px 0 var(--line);line-height:1.1}
.mod small{display:block;font-size:11px;color:var(--mute);font-weight:700}
.mod.on{background:var(--red);color:#fff;animation:pulseBtn .7s infinite alternate}
.winners{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;margin:12px 0}
.wbtn{border:3px solid var(--line);border-radius:18px;background:linear-gradient(160deg,var(--c),#0000 140%);box-shadow:0 5px 0 var(--line);cursor:pointer;
  padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:900;transition:transform .1s}
.wbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.wbtn svg{width:50px}
.wbtn span{background:var(--line);border-radius:999px;padding:1px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbtn small{font-family:var(--title);font-size:16px;font-weight:400;text-shadow:1px 1px 0 var(--line)}
.wbtn.lead{outline:4px solid var(--yellow);outline-offset:2px}
.stat{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.stat span{border-radius:999px;padding:4px 11px;font-weight:900;font-size:14px;border:2px solid var(--line);background:#0003}
.stat .s-ok{background:var(--green);color:var(--line)} .stat .s-over{background:var(--orange);color:var(--line)}
.tlog{margin:10px 0 0;padding:0 0 0 4px;list-style:none;display:flex;flex-wrap:wrap;gap:6px;counter-reset:t}
.tlog li{counter-increment:t;background:#0003;border-radius:10px;padding:4px 10px;font-size:14px;font-weight:700;animation:pop .3s}
.tlog li::before{content:counter(t) ". ";color:var(--yellow);font-weight:900}
.prompt{background:#ffd23f22;border:3px dashed var(--yellow);border-radius:16px;padding:12px;margin:12px 0;font-size:17px}

.srow{display:grid;grid-template-columns:150px repeat(var(--cols),auto) 1fr;gap:10px 14px;align-items:center;background:#0002;border-radius:16px;padding:10px 12px;margin-bottom:8px;border:3px solid transparent}
.srow.perfect{border-color:var(--green)}
.srow .who{display:flex;align-items:center;gap:7px;font-weight:900;font-size:17px;flex-wrap:wrap}
.srow .who svg{width:36px}
.fld{display:flex;flex-direction:column;align-items:center;gap:2px}
.fld>span{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--mute)}
.res{text-align:right}
.delta{font-family:var(--title);font-size:30px;display:block;line-height:1}
.delta.plus{color:var(--orange)} .delta.zero{color:var(--green)} .delta.minus{color:var(--teal)}
.tot{font-weight:900;font-size:14px;color:var(--mute)} .tot b{color:var(--ink);font-size:18px}
.det{grid-column:1/-1;font-size:13px;color:var(--mute)}
.selrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;font-weight:700}
select{font:inherit;font-weight:900;font-size:16px;padding:8px 10px;border-radius:10px;border:3px solid var(--line);background:#fff;color:var(--line)}

/* ---------- Historique ---------- */
.rank{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 16px}
.rank div{display:flex;align-items:center;gap:8px;background:#0003;border-radius:14px;padding:6px 12px;font-weight:900}
.rank svg{width:32px}
.rank .pos{font-family:var(--title);font-size:22px;color:var(--yellow)}
.logwrap{overflow-x:auto;border-radius:14px}
table.log{border-collapse:collapse;width:100%;min-width:520px}
.log th,.log td{padding:8px 8px;text-align:center;border-bottom:1px solid #ffffff1a;white-space:nowrap}
.log th{font-family:var(--title);font-weight:400;font-size:16px;color:var(--yellow);position:sticky;top:0;background:var(--panel)}
.log td.ms{display:flex;align-items:center;gap:6px;justify-content:center}
.log td.ms .cface{width:30px;border-width:2px;border-radius:5px;box-shadow:none;padding:2px}
.log .lb{font-size:13px;color:var(--mute);font-weight:700}
.log .ld{font-family:var(--title);font-size:19px;color:var(--orange)}
.log .ld.z{color:var(--green)}
.log tfoot td{font-family:var(--title);font-size:22px;color:var(--yellow);border:0}
.hist li{margin:6px 0}

/* ---------- Règles ---------- */
.rules ol{list-style:none;padding:0;margin:0;counter-reset:r}
.rules li{counter-increment:r;position:relative;padding:14px 16px 14px 70px;background:#0002;border-radius:16px;margin-bottom:12px;font-size:18px;line-height:1.45}
.rules li::before{content:counter(r);position:absolute;left:14px;top:12px;width:42px;height:42px;border-radius:50%;background:var(--yellow);color:var(--line);
  font-family:var(--title);font-size:26px;display:grid;place-items:center;border:3px solid var(--line);padding-top:4px}
.rules li h4{margin:0 0 4px;font-family:var(--title);font-weight:400;font-size:22px;color:var(--orange)}

/* ---------- Effets ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.fxp{position:absolute;left:0;top:0;font-size:34px;margin:-20px 0 0 -20px;will-change:transform}
.fxt{position:absolute;left:0;top:0;font-family:var(--title);font-size:38px;color:var(--yellow);text-shadow:3px 3px 0 var(--line);white-space:nowrap;transform:translate(-50%,-50%)}
.conf{position:absolute;top:-20px;width:12px;height:18px;border-radius:2px}
.fxt.hot{font-size:52px;color:#fff;text-shadow:0 0 12px var(--orange),3px 3px 0 var(--red),6px 6px 0 var(--line)}
.heat{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,#ff7a0066 68%,#e8243cdd 100%);
  box-shadow:inset 0 0 120px 30px #ff4d00aa}

/* ---------- Ça brûle ! ---------- */
.flames{position:absolute;left:50%;top:-38%;width:96%;height:100%;transform:translateX(-50%);z-index:-1;pointer-events:none;
  animation:flameIn .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes flameIn{from{transform:translateX(-50%) scaleY(0);transform-origin:50% 100%}}
.flames i{position:absolute;bottom:0;width:36%;height:78%;border-radius:50% 50% 38% 38%/72% 72% 28% 28%;
  background:radial-gradient(ellipse at 50% 88%,#fffbd0 0 14%,#ffd23f 30%,#ff8a00 55%,#e8243c 76%,transparent 80%);
  transform-origin:50% 100%;animation:flick .3s ease-in-out infinite alternate;filter:blur(.6px)}
.flames i:nth-child(1){left:0;height:55%;animation-delay:-.05s}
.flames i:nth-child(2){left:13%;height:78%;animation-delay:-.2s;animation-duration:.26s}
.flames i:nth-child(3){left:32%;height:100%;animation-delay:-.11s;animation-duration:.34s}
.flames i:nth-child(4){left:50%;height:82%;animation-delay:-.27s}
.flames i:nth-child(5){left:64%;height:58%;animation-delay:-.08s;animation-duration:.24s}
.flames i:nth-child(6){left:22%;height:46%;animation-delay:-.15s;animation-duration:.4s;width:24%}
.flames i:nth-child(7){left:54%;height:42%;animation-delay:-.3s;animation-duration:.37s;width:24%}
@keyframes flick{0%{transform:scaleY(.82) scaleX(1.06) skewX(-4deg)}100%{transform:scaleY(1.28) scaleX(.86) translateY(-10%) skewX(7deg)}}
.seat.burn .mask{animation:burnShake .1s linear 16 alternate;
  filter:drop-shadow(0 3px 0 var(--line)) drop-shadow(0 0 16px #ff5a00) sepia(1) saturate(9) hue-rotate(-28deg) brightness(1.05)}
.seat.burn .nm{background:var(--red);animation:blink .2s 8 alternate}
.mask .mo-s{display:none}
.seat.burn .mask .mo-s{display:inline}
.seat.burn .mask .mo-n{display:none}
.scream{position:absolute;left:0;top:0;font-family:var(--title);font-size:30px;color:var(--line);background:#fff;border:3px solid var(--line);
  border-radius:20px;padding:8px 14px 4px;white-space:nowrap;box-shadow:4px 4px 0 var(--red);transform-origin:0 100%}
.scream::after{content:"";position:absolute;left:16px;bottom:-14px;border:8px solid transparent;border-top:10px solid var(--line)}
@keyframes burnShake{from{transform:translateX(-3px) rotate(-5deg)}to{transform:translateX(3px) rotate(5deg) scale(1.08)}}

/* ---------- Tout tient à l'écran : versions compactes ---------- */
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:0}
.home .hero{font-size:clamp(40px,min(9vw,13vh),130px);line-height:1;margin:0 0 .25em;white-space:nowrap}
.home .hero span{font-size:.72em;vertical-align:.08em}
.home .lead{margin:0;font-size:clamp(14px,2.2vh,19px);position:relative;z-index:1}
.gamepick{width:100%;flex:1;min-height:0;max-height:62vh}
.gp{min-height:0;height:100%;padding:12px}
.gp img{flex:1;min-height:0;max-height:none;height:0}
.gpn{font-size:clamp(18px,3.4vh,28px)}
.home .hp{margin:0!important}
@media (orientation:landscape){
  .home{display:grid;grid-template-columns:1fr 1.5fr;grid-template-rows:1fr auto;gap:12px 30px;text-align:left}
  .home>div:first-child{align-self:center}
  .gamepick{max-height:none;height:100%}
  .home .hp{grid-column:1/-1;text-align:center}
}
.view{height:100%;display:flex;flex-direction:column;min-height:0}
.view>.panel{flex:1;min-height:0}
.cview .filters{flex:none;margin:0 0 10px;align-items:center}
.cview .filters .note{color:var(--mute);font-weight:700;font-size:14px}
.cgrid-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.cview .cgrid{gap:14px;justify-content:center;grid-template-columns:repeat(4,150px)}
.cview .ctile .ct{font-size:clamp(12px,1.2vw + .4vh,18px);margin-top:6px}
.cview .ctile .tag{margin-top:3px;font-size:10px}
.rules ol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (orientation:portrait){.rules ol{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rules li{margin:0;font-size:16px;line-height:1.38;padding:12px 12px 12px 58px}
.rules li::before{left:10px;top:10px;width:38px;height:38px;font-size:22px}
.rules li h4{font-size:19px}
.rules .diff{margin:10px 0 0;padding:0;list-style:none;font-size:14px;color:var(--mute)}
.rules .diff span+span::before{content:" · "}
.mgrid{grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.mbox{grid-template-columns:86px 1fr;padding:10px;margin:8px 0;gap:12px}
.mbox .rule{font-size:16px}
.mbox h4{font-size:20px}
.banner{margin:6px 0;padding:6px 10px}
.banner .cface{width:40px}
.banner span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.brow{padding:5px 8px;margin-bottom:5px}
.brow .who{width:118px;font-size:16px}
.brow .who svg{width:30px}
.chip{min-width:44px;height:44px;font-size:22px}
.winners{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;margin:8px 0}
.wbtn svg{width:40px}
.actions{margin-top:12px}

.srow .flds{grid-column:1/-1;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}

.srow .who{flex-wrap:nowrap;align-items:center}

.srow .bet{font-family:var(--title);font-size:26px;color:var(--yellow)}
.step button{width:34px;height:34px;font-size:20px}
.panel h2{font-size:clamp(20px,3.2vh,28px);margin-bottom:6px}
.card-sheet{grid-template-columns:min(40%,calc(78vh * 5 / 7)) 1fr}
.bigtimer{font-family:var(--title);font-size:min(46vmin,340px);color:var(--yellow);text-shadow:8px 8px 0 var(--red),14px 14px 0 var(--line);line-height:1;text-align:center}

.tick{animation:tick .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes tick{from{transform:scale(2.2);opacity:0}}

  border:3px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:14px;padding:11px 18px;transition:transform .3s cubic-bezier(.2,1.4,.4,1);max-width:92vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.victory{text-align:center}

.victory h2{font-size:44px!important}
.vnames{font-family:var(--title);font-size:36px;color:#fff;text-shadow:3px 3px 0 var(--pink),5px 5px 0 var(--line);margin:8px 0 16px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .petal{display:none}
}

const pById = (m, id) => m.players.find(p => p.id === id);

function extremes(m, most) {

}
function rolesOf(m) {
  const c = m.cur, r = {};
  const add = (ids, label, cls) => ids.forEach(id => (r[id] = r[id] || []).push({ label, cls }));
  if (fxOf(c, 'sabot')) add(extremes(m, true), 'Saboteur', 'sab');
  if (fxOf(c, 'guard')) add(extremes(m, false), 'Gardien', 'gar');
  if (fxOf(c, 'pm1')) add(extremes(m, true), '±1 pari', 'pm');

const isSab = (m, id) => !!fxOf(m.cur, 'sabot') && extremes(m, true).includes(id);
const betOrder = m => rot(m, m.dealer).filter(p => !isSab(m, p.id));

  for (let v = 0; v <= N; v++) {
    let why = '';

    if (!why && fxOf(c, 'nocopy') && i > 0 && c.bets[order[i - 1].id] === v) why = 'Copie du pari précédent';
    if (!why && G().sumRule && order.length > 1 && i === order.length - 1) {

function computeScore(m) {

  const live = {};
  ids.forEach(id => {
    const o = out[id] = { before: m.totals[id], lines: [], perfect: false };
    const r = (c.recv[id] || 0) * mult;
    live[id] = m.totals[id] + r + xfer[id];
    if (r) o.lines.push(`🌶 reçus pendant la manche +${r}${mult > 1 ? ' (×2)' : ''}`);
    if (xfer[id] > 0) o.lines.push(`🎁 Pilis offerts par les autres +${xfer[id]}`);
    if (xfer[id] < 0) o.lines.push(`🎁 Pilis donnés ${xfer[id]}`);

  if (fxOf(c, 'swapPilis') && c.lastW && c.swapWith && c.lastW !== c.swapWith && live[c.lastW] != null && live[c.swapWith] != null) {
    [live[c.lastW], live[c.swapWith]] = [live[c.swapWith], live[c.lastW]];
    out[c.lastW].lines.push(`🔄 échange ses Pilis avec ${nameOf(m, c.swapWith)}`);
    out[c.swapWith].lines.push(`🔄 échange ses Pilis avec ${nameOf(m, c.lastW)}`);

  ids.forEach(id => { base[id] = isSab(m, id) ? 0 : Math.abs((c.bets[id] ?? 0) - (c.won[id] || 0)); });

    else if (base[id] === 0) { o.perfect = true; o.lines.push('Pari réussi ✔'); }
    else o.lines.push(`Écart de ${base[id]} → +${base[id]}`);
    if (fxOf(c, 'designate') && c.designate[id]) {
      const d = c.designate[id]; pen += base[d] || 0;
      o.lines.push(`+${base[d] || 0} de ${nameOf(m, d)} (désigné)`);
    }
    if (fxOf(c, 'firstLast')) {
      if (c.firstW === id) { pen++; o.lines.push('1er pli +1'); }
      if (c.lastW === id) { pen++; o.lines.push('Dernier pli +1'); }
    }
    if (mult > 1 && pen) { pen *= mult; o.lines.push('Pénalités ×2'); }
    let minus = 0;
    if (fxOf(c, 'minus') && o.perfect && (c.bets[id] || 0) > 0) { minus = c.bets[id]; o.lines.push(`Pari réussi : défausse ${minus} Pili${minus > 1 ? 's' : ''}`); }
    const adj = c.adj[id] || 0; if (adj) o.lines.push(`Ajustement ${adj > 0 ? '+' : ''}${adj}`);

}

      if (!m.over && (c.phase === 'bets' || c.phase === 'play' || c.phase === 'score') && !isSab(m, p.id)) {
        const b = c.bets[p.id];
        if (c.phase === 'bets') h += `<span class="bub ${b == null ? 'q' : ''}">${b == null ? '?' : b}</span>`;
        else {
          const w = c.phase === 'score' ? (c.won[p.id] || 0) : wl[p.id], bb = b ?? 0;
          h += `<span class="bub ${w === bb ? 'ok' : w > bb ? 'over' : ''}">${w}/${bb}</span>`;
        }
      }
      return h;
    }
  });
}
function phaseNav(m) {
  const order = ['mission','bets','play','score'], labels = { mission:'Mission', bets:'Paris', play:'Plis', score:'Fin de manche' };
  const list = m.missions ? order : order.slice(1), cur = order.indexOf(m.cur.phase);
  return `<div class="phases">${list.map(p => { const i = order.indexOf(p);
    return `<button class="${i === cur ? 'on' : i < cur ? 'done' : ''}" ${i < cur ? `data-a="goPhase" data-v="${p}"` : 'disabled'}>${labels[p]}</button>`; }).join('<span class="muted">›</span>')}</div>`;
}
function missionBanner(m) {
  const mi = missionOf(m.cur); if (!mi) return '';
  const txt = mi.r.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  return `<button class="banner" data-a="card" data-v="${mi.k}">${face(mi)}<div><b>${esc(mi.t)}</b><span>${esc(txt.length > 150 ? txt.slice(0, 147) + '…' : txt)}</span></div></button>`;
}
function rolesBanner(m) {
  const r = rolesOf(m), items = Object.entries(r);
  if (!items.length) return '';
  return `<div class="roles">${items.map(([id, rs]) => rs.map(x => `<span class="rchip ${x.cls}" style="font-size:13px;padding:4px 10px">${x.label} : ${esc(nameOf(m, id))}</span>`).join('')).join('')}</div>`;
}
function gameView() {
  const m = M(), c = m.cur;
  const key = m.over ? 'over' : c.phase + m.rounds.length;
  const anim = key !== lastPanelKey ? 'anim' : ''; lastPanelKey = key;
  const body = m.over ? overPanel(m) : { mission:missionPhase, bets:betsPhase, play:playPhase, score:scorePhase }[c.phase](m);
  return `<div class="game-layout"><div class="left-col">${gameTable(m)}${m.over ? '' : phaseNav(m)}</div><div class="panel fit ${anim}"><div class="fitin">${body}</div></div></div>`;
}

function missionPhase(m) {
  const c = m.cur, g = G(), sel = missionOf(c), dealer = m.players[m.dealer];
  const all = DECK[S.game].flatMap(s => s.cards.filter(cd => cd.m));
  let h = `<h2>Manche ${m.rounds.length + 1} · La mission</h2>
    <p class="muted" style="margin:0 0 8px"><b>${esc(dealer.name)}</b> distribue. Retournez la mission et touchez-la ci-dessous${S.game === 'classic' ? ' (cadre rouge = experte)' : ''}.</p>
    <div class="mgrid">${all.map(cd => `<button class="mthumb ${c.mission === cd.k ? 'on' : ''}" data-a="selMission" data-v="${cd.k}" title="${esc(cd.t)}">${face(cd)}</button>`).join('')}</div>`;
  if (sel) {
    h += `<div class="mbox fit ${S._flash ? 'flash' : ''}"><div class="fitin"><div class="mgrid2"><div data-a="card" data-v="${sel.k}">${face(sel)}</div><div>${tag(sel.w)}<h4>${esc(sel.t)}</h4><div class="rule">${sel.r}</div>
      ${sel.variants ? Object.entries(sel.variants).map(([k, vals]) => `<div class="row"><span class="lbl">Chiffre sur la carte :</span>${vals.map(v => `<button class="chip ${(c.variant[k] ?? vals[0]) === v ? 'on' : ''}" data-a="variant" data-v="${k}|${v}">${v}</button>`).join('')}</div>`).join('') : ''}
      ${sel.a ? `<div class="appnote">📱 ${sel.a}</div>` : ''}</div></div></div></div>`;
    S._flash = false;
  } else h += '<div class="mbox fit empty">Touchez la mission retournée ci-dessus pour afficher sa règle (ou jouez sans mission).</div>';
  h += `<div class="row"><span class="lbl">Cartes à distribuer</span>${stepper('cards', c.cards)}<span class="muted small">${g.deckHint}</span></div>
    ${fxOf(c, 'extra') ? `<div class="ok">Avec cette mission : <b>${tricksTarget(m)} plis</b> à jouer.</div>` : ''}
    <div class="actions"><button class="btn ghost sm" data-a="noMission" style="visibility:${sel ? 'visible' : 'hidden'}">Sans mission</button><button class="btn big pink" data-a="toBets">Distribuer ➜ Paris</button></div>`;
  return h;
}

function betsPhase(m) {
  const c = m.cur, g = G(), N = tricksTarget(m), order = betOrder(m), cb = curBettor(m);
  const sum = order.reduce((a, p) => a + (c.bets[p.id] ?? 0), 0), all = !cb;
  let h = `<h2>Les paris</h2>${missionBanner(m)}${rolesBanner(m)}`;
  if (!m.missions) h += `<div class="row"><span class="lbl">Cartes par joueur</span>${stepper('cards', c.cards)}</div>`;
  const tm = fxOf(c, 'timer');
  if (tm) h += `<div class="actions" style="justify-content:flex-start;margin:6px 0 12px"><button class="btn orange" data-a="timer" data-v="${tm}">⏱ Chrono ${tm} secondes</button></div>`;
  h += order.map(p => {
    const opts = betOptions(m, p.id), b = c.bets[p.id];
    return `<div class="brow ${cb && cb.id === p.id ? 'cur' : ''}"><div class="who">${maskSVG(p.color)}<span>${esc(p.name)}</span></div>
      <div class="chips">${opts.map(o => `<button class="chip ${b === o.v ? 'on' : ''} ${o.why && b !== o.v ? 'no' : ''}" ${o.why && b !== o.v ? `title="${esc(o.why)}" data-a="betNo" data-v="${esc(o.why)}"` : `data-a="bet" data-v="${p.id}|${o.v}"`}>${o.v}</button>`).join('')}</div></div>`;
  }).join('');
  m.players.filter(p => isSab(m, p.id)).forEach(p => {
    h += `<div class="brow"><div class="who">${maskSVG(p.color)}<span>${esc(p.name)}</span></div><span class="rchip sab" style="font-size:13px;padding:4px 10px">Saboteur : pas de pari, +2 cartes</span></div>`;
  });
  h += `<div class="sumline"><span>Total des paris</span><span class="big">${sum}</span><span>pour</span><span class="big">${N}</span><span>pli${N > 1 ? 's' : ''}</span>
    <span class="muted small">${all ? (sum > N ? '→ ça va se battre !' : sum < N ? '→ quelqu’un va ramasser des plis en trop' : '→ tout le monde peut réussir') : ''}</span></div>`;
  if (g.sumRule && order.length > 1) h += `<div class="warn">Le dernier à parier (<b>${esc(order[order.length - 1].name)}</b>) ne peut pas faire une somme égale à ${N}.</div>`;
  h += `<div class="actions"><button class="btn ghost sm" data-a="toScoreDirect">Saisir les plis à la fin</button>
    <button class="btn big pink ${all ? 'pulse' : ''}" data-a="toPlay" ${all ? '' : 'disabled'}>Jouer les plis ➜</button></div>`;
  return h;
}

function playPhase(m) {
  const c = m.cur, N = tricksTarget(m), k = c.tricks.length, done = k >= N, lead = leaderId(m), spicy = S.game === 'spicy', wl = wonLive(m);
  let h = `<h2>${done ? '¡Todos los plis!' : `Pli ${k + 1} / ${N}`}</h2>${missionBanner(m)}`;
  if (c.pendingGive != null) {
    const t = c.tricks[c.pendingGive];
    h += `<div class="prompt">🎁 <b>${esc(nameOf(m, t.winner))}</b> peut donner 1 de ses Pilis à :<div class="namechips">${m.players.filter(p => p.id !== t.winner).map(p => `<button class="nchip" data-a="give" data-v="${p.id}">${esc(p.name)}</button>`).join('')}<button class="nchip" data-a="give" data-v="">Personne</button></div></div>`;
  } else if (!done) {
    h += `<p>Commence : <b style="color:var(--yellow)">${esc(nameOf(m, lead))}</b>. Touchez <b>le gagnant du pli</b> (ici ou sur la table).</p>`;
    if (spicy) h += `<div class="mods"><button class="mod ${c.mod.piment === 1 ? 'on' : ''}" data-a="piment" data-v="1">🌶 Piment +1<small>au gagnant</small></button>
      <button class="mod ${c.mod.piment === 2 ? 'on' : ''}" data-a="piment" data-v="2">🌶🌶 Piment +2<small>au gagnant</small></button>
      <button class="mod" data-a="discard">🗑 Pli défaussé<small>que des Spéciales</small></button></div>`;
    if (fxOf(c, 'trap')) h += `<div class="mods"><button class="mod ${c.mod.trap ? 'on' : ''}" data-a="trap">🎯 Numéro piégé<small>+1 Pili au gagnant</small></button></div>`;
    h += `<div class="winners">${m.players.map(p => `<button class="wbtn ${p.id === lead ? 'lead' : ''}" data-a="trick" data-v="${p.id}" style="--c:${p.color}">${maskSVG(p.color)}<span>${esc(p.name)}</span><small>${wl[p.id]} / ${isSab(m, p.id) ? '—' : (c.bets[p.id] ?? 0)}</small></button>`).join('')}</div>`;
  }
  if (k) h += `<ol class="tlog">${c.tricks.map(t => `<li>${t.winner ? esc(nameOf(m, t.winner)) : '🗑 défaussé'}${t.piment ? ` 🌶+${t.piment}` : ''}${t.trap ? ' 🎯+1' : ''}${t.giveTo ? ` 🎁→${esc(nameOf(m, t.giveTo))}` : ''}</li>`).join('')}</ol>`;
  h += `<div class="actions">${k ? '<button class="btn ghost sm" data-a="undoTrick">↶ Annuler le dernier pli</button>' : ''}
    ${done ? '<button class="btn ghost sm" data-a="moreTrick">+ un pli</button>' : ''}
    <button class="btn big ${done ? 'pink pulse' : 'ghost'}" data-a="toScore">Fin de manche ➜</button></div>`;
  return h;
}

function scorePhase(m) {
  const c = m.cur, sc = computeScore(m), N = tricksTarget(m), spicy = S.game === 'spicy';
  const showRecv = spicy || fxOf(c, 'trap'), showCheat = fxOf(c, 'guard');
  const sumWon = m.players.reduce((a, p) => a + (c.won[p.id] || 0), 0);
  const realTricks = c.tricks.length ? c.tricks.filter(t => t.winner).length : null;
  const opts = (sel, ex) => m.players.filter(p => p.id !== ex).map(p => `<option value="${p.id}" ${sel === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  let h = `<h2>Fin de manche : les Pilis</h2>${missionBanner(m)}`;
  if (fxOf(c, 'firstLast')) h += `<div class="selrow">1er pli gagné par <select data-ch="firstW"><option value="">—</option>${opts(c.firstW)}</select> · dernier pli par <select data-ch="lastW"><option value="">—</option>${opts(c.lastW)}</select></div>`;
  if (fxOf(c, 'swapPilis')) h += `<div class="selrow">Dernier pli : <select data-ch="lastW"><option value="">—</option>${opts(c.lastW)}</select> échange ses Pilis avec <select data-ch="swapWith"><option value="">personne</option>${opts(c.swapWith, c.lastW)}</select></div>`;
  h += `<div class="sgrid">${m.players.map(p => {
    const s = sc[p.id], sab = isSab(m, p.id);
    return `<div class="srow ${s.perfect ? 'perfect' : ''}">
      <div class="who">${maskSVG(p.color)}<div><b>${esc(p.name)}</b>${sab ? ' <span class="rchip sab">Saboteur</span>' : ''}
        ${fxOf(c, 'designate') ? `<div class="det">a désigné <select data-ch="designate" data-v="${p.id}"><option value="">—</option>${opts(c.designate[p.id], p.id)}</select></div>` : ''}
        <div class="det">${s.lines.join(' · ')}</div></div></div>
      <div class="res"><span class="delta ${s.delta > 0 ? 'plus' : s.delta < 0 ? 'minus' : 'zero'}">${s.delta > 0 ? '+' + s.delta : s.delta}</span><span class="tot">${s.before} ➜ <b>${s.after}</b></span></div>
      <div class="flds"><div class="fld"><span>Pari</span><b class="bet">${sab ? '—' : (c.bets[p.id] ?? 0)}</b></div>
      <div class="fld"><span>Plis gagnés</span>${stepper('won', c.won[p.id] || 0, p.id)}</div>
      ${showRecv ? `<div class="fld"><span>${spicy ? '🌶 Piments' : '🎯 Piégés'}</span>${stepper('recv', c.recv[p.id] || 0, p.id)}</div>` : ''}
      ${showCheat ? `<div class="fld"><span>Triche</span>${stepper('adj', c.adj[p.id] || 0, p.id)}</div>` : ''}</div></div>`;
  }).join('')}</div>`;
  if (realTricks != null ? sumWon !== realTricks : sumWon !== N)
    h += `<div class="warn">Total des plis saisis : <b>${sumWon}</b> (attendu : ${realTricks ?? N}). Vérifiez avant de valider.</div>`;
  if (showRecv) h += `<p class="muted small" style="margin:4px 0">${spicy ? '« 🌶 Piments » = Pilis donnés par les cartes Piment pendant la manche' : '« 🎯 Piégés » = plis contenant un numéro de la mission'} (déjà comptés si vous avez saisi les plis un par un).</p>`;
  if (showCheat) h += `<p class="muted small" style="margin:4px 0">« Triche » : −1 pour celui qui s’est débarrassé d’un Pili sans être vu, +1 pour celui qu’un Gardien a pris la main dans le sac.</p>`;
  h += `<div class="actions"><button class="btn ghost sm" data-a="goPhase" data-v="${c.tricks.length ? 'play' : 'bets'}">← Retour</button>
    <button class="btn big pink pulse" data-a="validate">Valider la manche 🌶</button></div>`;
  return h;
}

function ranking(m) { return [...m.players].sort((a, b) => m.totals[a.id] - m.totals[b.id]); }
function winnersOf(m) { const mn = Math.min(...m.players.map(p => m.totals[p.id])); return m.players.filter(p => m.totals[p.id] === mn); }
function overPanel(m) {
  const w = winnersOf(m);
  return `<div class="victory"><div class="crown">👑</div><h2>¡Fin de la partida!</h2>
    <div class="vnames">${w.map(p => esc(p.name)).join(' & ')}</div>
    <div class="rank" style="justify-content:center">${ranking(m).map((p, i) => `<div><span class="pos">${i + 1}</span>${maskSVG(p.color)}${esc(p.name)} · 🌶 ${m.totals[p.id]}</div>`).join('')}</div>
    <div class="actions" style="justify-content:center"><button class="btn ghost sm" data-a="undoRound">↶ Annuler la dernière manche</button>
    <button class="btn ghost sm" data-a="tab" data-v="log">📒 Historique</button>
    <button class="btn teal" data-a="quit">Nouveaux joueurs</button><button class="btn big pink" data-a="rematch">¡Revancha! 🌶</button></div></div>`;
}

/* ----- Historique ----- */
function logView() {
  const m = M();
  const hist = S.history.filter(x => x.game === S.game);
  const histHTML = hist.length ? `<h3>Parties terminées</h3><ul class="hist">${hist.slice(0, 15).map(x => `<li><b>${new Date(x.date).toLocaleDateString('fr-FR')}</b> · 👑 ${x.winners.map(esc).join(' & ')} · ${x.players.map(p => `${esc(p.name)} ${p.total}`).join(', ')} (${x.rounds} manches)</li>`).join('')}</ul>` : '';
  if (!m) return `<div class="view"><div class="panel fit anim"><div class="fitin"><h2>Historique</h2><p class="muted">Aucune partie en cours.</p>${histHTML}</div></div></div>`;

    <div class="rank">${ranking(m).map((p, i) => `<div><span class="pos">${i + 1}</span>${maskSVG(p.color)}${esc(p.name)} · 🌶 ${m.totals[p.id]}</div>`).join('')}</div>
    ${m.rounds.length ? `<div class="logwrap"><table class="log"><thead><tr><th>#</th><th>Donneur</th><th>Mission</th><th>Cartes</th>${m.players.map(p => `<th>${esc(p.name)}</th>`).join('')}</tr></thead>
    <tbody>${m.rounds.map(r => `<tr><td><b>${r.n}</b></td><td>${esc(nameOf(m, r.dealer))}</td>
      <td class="ms">${r.mission && CARD[r.mission] ? `<span data-a="card" data-v="${r.mission}" style="cursor:pointer;display:flex;gap:6px;align-items:center">${face(CARD[r.mission])}<span class="small">${esc(CARD[r.mission].t)}</span></span>` : '<span class="muted">—</span>'}</td>
      <td>${r.cards}</td>
      ${ids.map(id => `<td><span class="lb">${r.bets[id] == null ? '—' : r.bets[id]}/${r.won[id] ?? 0}</span> <span class="ld ${r.delta[id] ? '' : 'z'}">${r.delta[id] > 0 ? '+' + r.delta[id] : r.delta[id] || '✔'}</span></td>`).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="4" style="text-align:right">Total</td>${ids.map(id => `<td>${m.totals[id]}</td>`).join('')}</tr></tfoot></table></div>
    <p class="muted small">Chaque case : pari/plis remportés, puis Pilis reçus (✔ = pari réussi sans Pili).</p>` : '<p class="muted">Pas encore de manche terminée.</p>'}
    <div class="actions">${m.rounds.length ? '<button class="btn ghost sm" data-a="undoRound">↶ Annuler la dernière manche</button>' : ''}
      <button class="btn ghost sm" data-a="quit">Abandonner la partie</button></div>
    ${histHTML}</div></div></div>`;
}

/* ---------------- Actions ---------------- */
function seatName(n) {
  n = n.trim().slice(0, 16); if (!n) return;
  const st = S.setup;
  if (st.players.includes(n)) { toast(n + ' est déjà à table'); return; }
  if (st.players.length >= 8) { toast('8 joueurs maximum'); return; }
  st.players.push(n);
  NAMES = [n, ...NAMES.filter(x => x !== n)].slice(0, 40); LS.set('pp_names', NAMES);
  sfx.tap(); render();
  const i = $('#newname'); if (i) i.focus();
}
function startMatch() {
  const st = S.setup;
  const players = st.players.map((n, i) => ({ id:'p' + i + '_' + Date.now().toString(36), name:n, color:COLORS[i % 8] }));
  const m = { game:S.game, players, dealer:Math.min(st.dealer, players.length - 1), totals:{}, rounds:[], missions:!!st.missions, over:false, started:Date.now() };
  players.forEach(p => (m.totals[p.id] = 0));
  m.cur = newRound(m);
  S.matches[S.game] = m;
  sfx.deal(); render();
}
function award(pid) {
  const m = M(), c = m.cur;
  if (m.over || c.phase !== 'play' || c.pendingGive != null || c.tricks.length >= tricksTarget(m)) return;
  const t = { winner:pid, piment:c.mod.piment || 0, trap:!!c.mod.trap };
  c.tricks.push(t); c.mod = {};
  if (fxOf(c, 'pgive') && livePilis(m, pid) > 0) c.pendingGive = c.tricks.length - 1;
  const hot = ((t.piment || 0) + (t.trap ? 1 : 0)) * (fxOf(c, 'x2') ? 2 : 1);
  sfx.trick(); if (hot) sfx.burn(hot);
  render();
  const seat = $(`.seat[data-pid="${pid}"]`);
  if (seat) { if (hot) burnSeat(seat, hot); else { burstAt(seat, '🃏', 3); floatText(seat, '+1 pli'); } }
  if (c.tricks.length >= tricksTarget(m) && c.pendingGive == null) toast('Tous les plis sont joués : passez à la fin de manche !');
}
function validateRound() {
  const m = M(), c = m.cur, sc = computeScore(m), g = G();
  const rec = { n:m.rounds.length + 1, dealer:m.players[m.dealer].id, mission:c.mission, cards:c.cards, bets:{}, won:{}, delta:{},
    before:{ ...m.totals }, cur:JSON.parse(JSON.stringify(c)) };
  m.players.forEach(p => {
    rec.bets[p.id] = isSab(m, p.id) ? null : (c.bets[p.id] ?? 0);
    rec.won[p.id] = c.won[p.id] || 0;
    rec.delta[p.id] = sc[p.id].delta;
  });
  m.players.forEach(p => (m.totals[p.id] = sc[p.id].after));
  m.rounds.push(rec); m.lastCards = c.cards;
  const max = Math.max(...m.players.map(p => m.totals[p.id]));
  if (max >= g.limit) {
    m.over = true;
    const w = winnersOf(m);
    S.history.unshift({ game:S.game, date:Date.now(), rounds:m.rounds.length, winners:w.map(p => p.name), players:m.players.map(p => ({ name:p.name, total:m.totals[p.id] })) });
    S.history = S.history.slice(0, 40);
  } else {
    m.dealer = (m.dealer + 1) % m.players.length;
    m.cur = newRound(m);
  }
  render();
  toTop();
  // Les brûlés d'abord (un par un, chacun son « aïe »), puis les paris réussis
  const burnt = m.players.filter(p => sc[p.id].delta > 0);
  burnt.forEach((p, i) => {
    const d = sc[p.id].delta;
    setTimeout(() => {
      const seat = $(`.seat[data-pid="${p.id}"]`); if (!seat) return;
      chiliRain(seat, d);
      setTimeout(() => { burnSeat(seat, d); sfx.burn(d); }, 650);
    }, 200 + i * 900);
  });
  const after = 200 + burnt.length * 900;
  m.players.forEach((p, i) => {
    const seat = () => $(`.seat[data-pid="${p.id}"]`);
    if (sc[p.id].delta <= 0 && sc[p.id].perfect) setTimeout(() => { const s = seat(); if (s) { burstAt(s, '✨', 8); floatText(s, '¡Perfecto!'); } }, 250 + i * 120);
    else if (sc[p.id].delta < 0) setTimeout(() => { const s = seat(); if (s) floatText(s, sc[p.id].delta + ' 🌶 ¡qué alivio!'); }, 250 + i * 120);
  });
  if (!burnt.length && m.players.some(p => sc[p.id].perfect)) sfx.perfect();
  if (m.over) setTimeout(() => { sfx.fanfare(); confetti(); }, after + 400);
}
function undoRound() {
  const m = M(); if (!m || !m.rounds.length) return;
  const rec = m.rounds.pop();
  m.totals = { ...rec.before };
  m.dealer = Math.max(0, m.players.findIndex(p => p.id === rec.dealer));
  m.cur = Object.assign(newRound(m), rec.cur, { phase:'score' });
  if (m.over && S.history[0] && S.history[0].game === S.game && S.history[0].rounds === rec.n) S.history.shift();
  m.over = false;
  S.tab = 'game'; toast('Manche ' + rec.n + ' annulée : retour à la fin de manche'); render();
}

const ACT = {
  home() { S.game = null; sfx.tap(); render(); },
  pickGame(v) { S.game = v; S.tab = 'game'; S.cardFilter = 'missions'; sfx.flip(); render(); },

/* ---------------- Glisser-déposer (mise en place) ---------------- */
let drag = null, eatClick = false;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el || e.target.closest('.x')) return;
  drag = { el, data: el.dataset.drag, x0: e.clientX, y0: e.clientY, on: false, ghost: null, over: null };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 10) return;
    drag.on = true;
    const g = drag.el.cloneNode(true); g.classList.add('ghost'); ['data-drag', 'data-dropidx', 'data-a', 'data-pid'].forEach(k => g.removeAttribute(k));
    const r = drag.el.getBoundingClientRect(); g.style.width = r.width + 'px'; g.style.position = 'fixed';
    document.body.appendChild(g); drag.ghost = g; drag.el.classList.add('dragging'); sfx.tap();
  }
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  const tgt = dropTarget(e.clientX, e.clientY);
  if (tgt !== drag.over) { if (drag.over) drag.over.classList.remove('dropover'); drag.over = tgt; if (tgt) tgt.classList.add('dropover'); }
});
function dropTarget(x, y) {
  let best = null, bd = 1e9;
  $$('[data-dropidx]').forEach(t => {
    if (t === drag.el) return;
    const r = t.getBoundingClientRect(), d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
    if (d < Math.max(70, r.width * .8) && d < bd) { bd = d; best = t; }
  });
  if (best) return best;
  const z = document.elementFromPoint(x, y);
  const zone = z && z.closest('[data-dropzone]'); if (zone) return zone;
  const tbl = z && z.closest('.table'); return tbl || null;
}
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.on) return;
  eatClick = true; setTimeout(() => (eatClick = false), 0);
  d.ghost.remove(); d.el.classList.remove('dragging'); if (d.over) d.over.classList.remove('dropover');
  const st = S.setup, t = d.over; if (!t) { render(); return; }
  const [kind, val] = d.data.split('|');
  const dealerName = st.players[st.dealer];
  if (kind === 'seat') {
    const from = +val;
    if (t.dataset.dropzone === 'unseat') st.players.splice(from, 1);
    else {
      const to = t.dataset.dropidx != null ? +t.dataset.dropidx : st.players.length - 1;
      const [n] = st.players.splice(from, 1); st.players.splice(to, 0, n);
    }
  } else if (kind === 'name' && t.dataset.dropzone !== 'unseat') {
    if (st.players.length >= 8) { toast('8 joueurs maximum'); render(); return; }
    const to = t.dataset.dropidx != null ? +t.dataset.dropidx : st.players.length;
    st.players.splice(to, 0, val);
    NAMES = [val, ...NAMES.filter(x => x !== val)]; LS.set('pp_names', NAMES);
  }
  const di = st.players.indexOf(dealerName); st.dealer = di >= 0 ? di : 0; st.swapSel = null;
  sfx.flip(); render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', () => { if (!drag) return; const on = drag.on; if (on) { drag.ghost.remove(); drag.el.classList.remove('dragging'); } drag = null; if (on) render(); });

document.addEventListener('click', e => {
  if (eatClick) { e.stopPropagation(); e.preventDefault(); return; }
  const el = e.target.closest('[data-a]'); if (!el) {
    if (e.target.id === 'modal') closeModal();
    return;
  }
  const f = ACT[el.dataset.a]; if (f) f(el.dataset.v, el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-ch]'); if (!el) return;
  CHG[el.dataset.ch](el.value, el.dataset.v); sfx.tap(); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newname') seatName(e.target.value);
  if (e.key === 'Escape') closeModal();

function openModal(html) { const md = $('#modal'); md.innerHTML = html; md.classList.remove('hidden'); fitAll(); }

/* ---------------- Tout tient à l'écran (aucun défilement) ---------------- */
// Réduit le contenu d'une boîte (échelle + reflow plus large) jusqu'à ce qu'il tienne dans sa hauteur
function fitBox(box, Hmax) {
  const inn = box && box.querySelector(':scope > .fitin'); if (!inn) return 1;
  inn.style.transform = ''; inn.style.width = ''; inn.style.marginBottom = ''; inn.style.marginRight = '';
  const cs = getComputedStyle(box);
  const W = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = Hmax ?? (box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom));
  if (inn.offsetHeight <= H + 1) return 1;
  let lo = .3, hi = 1, s = .3;
  for (let i = 0; i < 9; i++) {                      // recherche dichotomique de la plus grande échelle qui tient
    const mid = (lo + hi) / 2;
    inn.style.width = (W / mid) + 'px';
    if (inn.offsetHeight * mid <= H) { s = mid; lo = mid; } else hi = mid;
  }
  inn.style.width = (W / s) + 'px';
  inn.style.transform = `scale(${s})`;
  inn.style.marginRight = -(W / s - W) + 'px';
  inn.style.marginBottom = -(inn.offsetHeight * (1 - s)) + 'px';
  return s;
}
// Onglet Cartes : choisit le nombre de colonnes qui donne les plus grandes cartes sans dépasser
function fitCards() {
  const wrap = $('.cgrid-wrap'); if (!wrap) return;
  const grid = wrap.querySelector('.cgrid'), n = grid.children.length; if (!n) return;
  const W = wrap.clientWidth, H = wrap.clientHeight, gap = 14;
  const tile = grid.children[0], cap = tile.offsetHeight - tile.querySelector('.cface').offsetHeight + 4;
  let best = { w:0, c:1 };
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const w = Math.min((W - gap * (c - 1)) / c, ((H - gap * (r - 1)) / r - cap) * 5 / 7, 260);
    if (w > best.w) best = { w, c };
  }
  grid.style.gridTemplateColumns = `repeat(${best.c}, ${Math.floor(best.w)}px)`;
}
// Historique : si même réduit c'est trop long, on masque les plus vieilles manches
function fitLog(box) {
  let s = fitBox(box);
  const rows = $$('table.log tbody tr', box);
  let hidden = 0;
  while (s < .62 && hidden < rows.length - 3) { rows[hidden++].style.display = 'none'; s = fitBox(box); }
  if (hidden) {
    const tb = $('table.log tbody', box), tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="99" class="muted small">… ${hidden} manche${hidden > 1 ? 's' : ''} plus ancienne${hidden > 1 ? 's' : ''} masquée${hidden > 1 ? 's' : ''} (les totaux en bas comptent tout)</td>`;
    tb.prepend(tr); fitBox(box);
  }
}
function fitAll() {
  fitCards();
  $$('#app .fit').forEach(b => (S.tab === 'log' && S.game ? fitLog(b) : fitBox(b)));
  const sh = $('#modal .sheet.fit'); if (sh) fitBox(sh, innerHeight * .94 - 44);
}
function toTop() { window.scrollTo({ top:0, behavior:'smooth' }); $$('main, .game-layout>.panel').forEach(e => e.scrollTo({ top:0, behavior:'smooth' })); }

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
function centerOf(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height * .35]; }
function chiliRain(seat, n) {
  if (RM) return;
  const felt = $('.felt'); const [sx, sy] = felt ? centerOf(felt) : [innerWidth / 2, innerHeight / 2];
  const [tx, ty] = centerOf(seat);
  for (let i = 0; i < Math.min(12, n * 3); i++) {
    const el = document.createElement('div'); el.className = 'fxp'; el.textContent = '🌶️'; $('#fx').appendChild(el);
    const mx = (sx + tx) / 2 + rnd(-80, 80), my = Math.min(sy, ty) - rnd(60, 140);

      { transform:`translate(${tx + rnd(-20, 20)}px,${ty + rnd(-10, 10)}px) scale(.9) rotate(${rnd(-360, 360)}deg)`, opacity:1, offset:.85 },
      { transform:`translate(${tx}px,${ty + 30}px) scale(.4)`, opacity:0 }

  }

// Le joueur prend des Pilis : le masque rougit, prend feu, fume des oreilles, l'écran chauffe

    { duration:1500, easing:'ease-out', fill:'both' }).onfinish = () => el.remove();
}
function confetti() {
  if (RM) return;
  const cols = ['#ff2e88','#ff8a00','#ffd23f','#14c8b4','#8e44ff','#7bd83a','#2f9bff'];
  for (let i = 0; i < 140; i++) {
    const el = document.createElement('div'); el.className = 'conf';
    el.style.left = rnd(0, 100) + 'vw'; el.style.background = cols[i % cols.length]; $('#fx').appendChild(el);
    el.animate([{ transform:`translate(0,0) rotate(0deg)` }, { transform:`translate(${rnd(-120, 120)}px,${innerHeight + 60}px) rotate(${rnd(360, 1440)}deg)` }],
      { duration:rnd(2200, 4200), delay:rnd(0, 900), easing:'cubic-bezier(.25,.5,.5,1)', fill:'both' }).onfinish = () => el.remove();
  }
}

/* ---------------- Décor : papel picado & pétales ---------------- */
function buildPapel() {
  const cols = ['#ff2e88','#ff8a00','#14c8b4','#ffd23f','#8e44ff','#7bd83a','#2f9bff','#e8243c'];
  const holesA = 'M21 26a9 9 0 1 0 18 0a9 9 0 1 0-18 0ZM26 26a4 4 0 1 0 8 0a4 4 0 1 0-8 0ZM30 5l4 6-4 6-4-6ZM30 37l4 6-4 6-4-6ZM8 26l6-4 6 4-6 4ZM40 26l6-4 6 4-6 4ZM6 6h7l-7 7ZM54 6h-7l7 7ZM6 46a3 3 0 1 0 6 0a3 3 0 1 0-6 0ZM48 46a3 3 0 1 0 6 0a3 3 0 1 0-6 0Z';
  const holesB = 'M18 14h24l-12 14ZM18 38h24l-12-14ZM8 8a4 4 0 1 0 8 0a4 4 0 1 0-8 0ZM44 8a4 4 0 1 0 8 0a4 4 0 1 0-8 0ZM8 26l5-5 5 5-5 5ZM42 26l5-5 5 5-5 5ZM26 48a4 4 0 1 0 8 0a4 4 0 1 0-8 0Z';
  const outer = 'M0 0H60V54L55 62L50 54L45 62L40 54L35 62L30 54L25 62L20 54L15 62L10 54L5 62L0 54Z';
  const w = innerWidth, sp = (innerHeight <= 700 ? 28 : 40) + 10, n = Math.ceil(w / sp) + 1;
  $('#papel').innerHTML = Array.from({ length:n }, (_, i) =>
    `<div class="flag" style="left:${i * sp - 6}px;animation-delay:${(-i * .37).toFixed(2)}s;animation-duration:${(3 + (i % 3) * .5).toFixed(1)}s"><svg viewBox="0 0 60 62"><path fill-rule="evenodd" fill="${cols[i % cols.length]}" d="${outer}${i % 2 ? holesB : holesA}"/></svg></div>`).join('');
}
function petals() {
  if (RM) return;
  for (let i = 0; i < 9; i++) {
    const p = document.createElement('div'); p.className = 'petal';
    p.style.left = rnd(0, 100) + 'vw'; p.style.setProperty('--dx', rnd(-140, 140) + 'px');
    p.style.animationDuration = rnd(14, 26) + 's'; p.style.animationDelay = -rnd(0, 26) + 's';
    p.style.transform = `scale(${rnd(.6, 1.2)})`;
    document.body.appendChild(p);
  }
}

/* ---------------- Écran toujours allumé + démarrage audio ---------------- */
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => (wakeLock = null)); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
document.addEventListener('pointerdown', () => {
  keepAwake();
  if (S.sound.music && !SND.playing) { SND.start(S.sound.track || 0); setTimeout(renderTop, 50); }
}, { passive:true });

let rzT = null;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { buildPapel(); render(); }, 150); });
if (document.fonts) document.fonts.ready.then(fitAll);
$$('img').forEach(i => i.complete || i.addEventListener('load', fitAll, { once:true }));
buildPapel(); petals(); render();
</script>
</body>
</html>
